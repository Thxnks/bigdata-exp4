spark.app.name=AirlineSuccessProcessor
spark.log.level=WARN
spark.checkpoint.location=processor/checkpoints/stat_result
spark.trigger.interval=10 seconds

kafka.bootstrap.servers=192.168.88.101:9092
kafka.topic=gds-log-topic
kafka.starting.offsets=latest

mysql.url=jdbc:mysql://192.168.88.101:3306/bigdata_exp4?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
mysql.database=bigdata_exp4
mysql.table=stat_result
mysql.username=root
mysql.password=root
mysql.driver=com.mysql.cj.jdbc.Driver

local.input.primary=data/kafka采集数据实验.txt
local.input.fallback=processor/data/sample_log.txt

# HBase 输出(列式存储, 加分项)。留空则跳过 HBase 写入。
hbase.zookeeper.quorum=node1
hbase.zookeeper.port=2181
hbase.table=stat_result

# HDFS 输出(满足"结果存 HDFS"要求)。留空则跳过 HDFS 写入。
hdfs.output.path=hdfs://node1:8020/user/hadoop/stat_result_out
